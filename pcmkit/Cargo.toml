[workspace]
resolver = "2"
members = ["crates/pcmkit", "crates/pcmx", "crates/pcmkit-ffi"]
# The fuzz package links libFuzzer and is built only by the heavy job.
exclude = ["fuzz", "kani"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
