site_name: Verification Engineering for AI Coding Agents
site_description: A hands-on course in proving what a coding agent claims to have done.
site_author: Arunkumar Maniam Rajan
site_url: https://pragmaticarun.github.io/verification-engineering-course/
repo_url: https://github.com/pragmaticarun/verification-engineering-course
repo_name: pragmaticarun/verification-engineering-course
edit_uri: edit/main/docs/
copyright: Prose is CC BY 4.0. Code is MIT.

strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Setup: setup.md
  - Article map: mapping.md
  - Claim check: claims.md
  - Glossary: glossary.md
